name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: orbit, POSTGRES_PASSWORD: orbit, POSTGRES_DB: orbit_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orbit" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - name: Tests (SQLite)
        run: npm test
      - name: Tests (PostgreSQL)
        run: npm run test:pg
        env:
          DATABASE_URL: postgres://orbit:orbit@localhost:5432/orbit_test
      - name: Migrations apply cleanly and match the entities
        run: |
          npm run migration:run
          npm run migration:generate -- src/database/migrations/Drift 2>&1 | tee drift.log
          grep -q "No changes in database schema" drift.log
        env:
          DB_TYPE: postgres
          DATABASE_URL: postgres://orbit:orbit@localhost:5432/orbit_test
  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npm run build
