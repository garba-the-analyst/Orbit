# Free hosting for the DEMO build (no server, no database, no card): GitHub Pages.
# One-time setup: repo Settings > Pages > Source = "GitHub Actions". Then every push to main redeploys,
# and the demo lives at https://<your-username>.github.io/<repo-name>/
name: Demo web app (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/demo-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npm run build
        env:
          VITE_DEMO: 'true'
          VITE_BASE: /${{ github.event.repository.name }}/
      # Single-page app: unknown paths must serve the app, so deep links and refreshes work on Pages.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: mobile/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
