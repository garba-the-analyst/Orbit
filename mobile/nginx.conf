server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build files can be cached for a long time; the page itself must always be re-checked.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # The app uses real URLs (/c/shops, /m/orders ...), so unknown paths must load the app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
