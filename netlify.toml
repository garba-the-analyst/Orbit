# Static hosting for the ORBIT web app.
# Connected repo: https://github.com/garba-the-analyst/Orbit.git (branch main)
# Build from the mobile/ subdirectory; set VITE_API_URL in Netlify Site settings > Environment.

[build]
  base = "mobile"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self)"
